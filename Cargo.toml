[package]
name = "nanobug-maven-guest"
version = "0.1.18"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Nanobug --plugin-cargo entry supplies the independent public SDK cache.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
exclude = ["native"]
